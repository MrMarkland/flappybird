<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Floppy Bird Game</title>
<link rel="stylesheet" href="style.css" />

<!-- Google API -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>

<link rel="preload" as="image" href="assets/bird.png" />
<link rel="preload" as="image" href="assets/bird-flap1.png" />
<link rel="preload" as="image" href="assets/bird-flap2.png" />
<link rel="preload" as="image" href="assets/pipe-bottom.png" />
<link rel="preload" as="image" href="assets/ground.png" />
<link rel="preload" as="image" href="assets/bg.png" />
</head>

<body>

<div id="menu">
  <h1>Floppy Bird</h1>
  <p>Upload music and press Play</p>
  <input type="file" id="musicUpload" accept="audio/*" />
  <button id="playBtn">Play Game</button>
  <p class="hint">Rotate phone to landscape</p>
</div>

<canvas id="gameCanvas"></canvas>

<script src="game.js"></script>
</body>
</html>
